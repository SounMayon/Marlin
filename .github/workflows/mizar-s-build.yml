name: Mizar S Marlin 2.1.2.9 build

on:
  push:
    branches:
      - mizar-s-marlin-2.1.2.9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build Geeetech Mizar S firmware
        run: pio run -e STM32F103VE_GTM32_maple

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mizar-s-marlin-2.1.2.9
          path: |
            .pio/build/STM32F103VE_GTM32_maple/firmware.bin
            .pio/build/STM32F103VE_GTM32_maple/firmware.elf
          if-no-files-found: error
          retention-days: 30

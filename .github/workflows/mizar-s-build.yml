name: Mizar S Marlin 2.1.2.9 build

on:
  push:
    branches:
      - mizar-s-marlin-2.1.2.9
      - test/color-swap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio pillow

      - name: Build Geeetech Mizar S firmware
        run: pio run -e STM32F103VE_GTM32_maple

      - name: Prepare Geeetech Mizar S TFT icons
        run: python tools/prepare_mizar_s_tft_assets.py .pio/build/STM32F103VE_GTM32_maple/assets

      - name: Verify LVGL TFT assets
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("Marlin/src/lcd/extui/mks_ui/pic_manager.cpp").read_text(encoding="utf-8")
          assets_dir = Path(".pio/build/STM32F103VE_GTM32_maple/assets")
          if not assets_dir.is_dir():
              raise SystemExit(f"LVGL assets directory missing: {assets_dir}")

          registered = set()
          for line in source.splitlines():
              line = line.strip()
              if line.startswith('F("'):
                  name = line.split('"')[1]
                  if name.casefold().endswith(".bin"):
                      registered.add(name.casefold())

          mizar_required = {
              "bmp_clear.bin", "bmp_confirm.bin", "bmp_confirm_dis.bin",
              "bmp_led_color.bin", "bmp_led_off.bin", "bmp_led_white.bin",
              "bmp_leveling_auto.bin", "bmp_leveling_manual.bin",
              "bmp_machine_para.bin", "bmp_machine_para_dis.bin",
              "bmp_motor_off.bin", "bmp_mov.bin", "bmp_zero.bin",
          }
          unregistered = sorted(mizar_required - registered)
          if unregistered:
              raise SystemExit("Mizar S icons missing from pic_manager.cpp: " + ", ".join(unregistered))

          available = {path.name.casefold() for path in assets_dir.iterdir() if path.is_file()}
          missing = sorted((registered | mizar_required) - available)
          if missing:
              raise SystemExit("Missing LVGL assets: " + ", ".join(missing))
          print(f"Validated {len(registered)} registered assets and {len(mizar_required)} Mizar S icons in {assets_dir}")
          PY

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mizar-s-marlin-2.1.2.9
          path: |
            .pio/build/STM32F103VE_GTM32_maple/firmware.bin
            .pio/build/STM32F103VE_GTM32_maple/firmware.elf
            .pio/build/STM32F103VE_GTM32_maple/assets/
          if-no-files-found: error
          retention-days: 30
